# Usage (run from the repo root):
#   docker compose -f docker/docker-compose.yml --profile trainer up --build
#   docker compose -f docker/docker-compose.yml --profile api up --build -d
#
# GPU access requires the NVIDIA Container Toolkit on the host
# (https://github.com/NVIDIA/nvidia-container-toolkit). Without it, drop
# the `deploy.resources.reservations.devices` block from both services to
# run on CPU (slow, but functional — matches the fallback already built
# into train.py / predict.py).

services:
  trainer:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    image: ai-voice-employee:latest
    profiles: ["trainer"]
    # --train-only runs training -> merge. Evaluation is folded in once
    # src/eval/evaluate.py exists (Phase 6 is not built yet in this repo).
    command: ["scripts/run_pipeline.sh", "--train-only"]
    volumes:
      - ../data:/app/data
      - ../outputs:/app/outputs
      - ../configs:/app/configs
      - hf_cache:/app/.cache/huggingface
    environment:
      - HF_TOKEN=${HF_TOKEN:-}
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

  api:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    image: ai-voice-employee:latest
    profiles: ["api"]
    command: ["scripts/run_pipeline.sh", "--serve"]
    ports:
      - "8000:8000"
    volumes:
      - ../outputs:/app/outputs
      - ../configs:/app/configs
      - hf_cache:/app/.cache/huggingface
    environment:
      - HF_TOKEN=${HF_TOKEN:-}
      - MERGED_MODEL_DIR=/app/outputs/merged_model
      - PORT=8000
      # Phase 14: OpenTelemetry tracing configuration
      - TRACING_ENABLED=${TRACING_ENABLED:-false}
      - OTEL_SERVICE_NAME=ai-voice-agent
      - OTEL_EXPORTER_TYPE=${OTEL_EXPORTER_TYPE:-console}
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://jaeger:4317
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s

  postgres:
    image: postgres:16-alpine
    profiles: ["test", "dev"]
    environment:
      - POSTGRES_DB=ai_voice_agent
      - POSTGRES_USER=voice_app
      - POSTGRES_PASSWORD=voice_secret
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U voice_app -d ai_voice_agent"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Phase 14: Jaeger all-in-one for distributed trace collection and visualization.
  jaeger:
    image: jaegertracing/jaeger:2
    profiles: ["observability"]
    ports:
      - "16686:16686"    # Jaeger UI
      - "4317:4317"      # OTLP gRPC receiver
      - "4318:4318"      # OTLP HTTP receiver
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
    restart: unless-stopped

volumes:
  hf_cache:
  postgres_data:
