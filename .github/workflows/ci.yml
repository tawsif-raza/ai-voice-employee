name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install CPU-only torch
        run: pip install torch --index-url https://download.pytorch.org/whl/cpu

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      # Quality gates run fastest-and-most-mechanical first, so a
      # formatting slip fails in seconds rather than after the full
      # (slower) test suite has already run. See
      # PHASE_14_1_WORKFLOW_HARDENING_REPORT.md for what each gate
      # enforces vs. treats as pre-existing, documented technical debt.
      - name: Check formatting (ruff format)
        run: python -m ruff format --check src/ tests/ scripts/ notebooks/

      - name: Lint (ruff check)
        run: python -m ruff check src/ tests/ scripts/ notebooks/

      - name: Type-check (mypy)
        run: python -m mypy src/

      - name: Run test suite
        env:
          APP_ENV: dev
          PERSISTENCE_MODE: dev
          AUTH_MODE: dev
        run: python -m pytest tests/ -v

  # H4 (docs/MASTER_PROJECT_PLAN.md): build the exact production image and
  # test THAT artifact -- its dependency set, its configuration, its
  # entrypoint, and its failure behaviour -- instead of only the dev venv
  # above. Every step below runs against the image built in this job.
  production-image:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: ai_voice_agent
          POSTGRES_USER: voice_app
          POSTGRES_PASSWORD: ci-only-not-a-secret
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U voice_app -d ai_voice_agent"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      IMAGE: ai-voice-agent:ci
      # Throwaway CI-service credentials, not a deployment secret.
      DATABASE_URL: postgresql://voice_app:ci-only-not-a-secret@127.0.0.1:5432/ai_voice_agent
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.12.3"

      # The image installs requirements-production.lock; the lock must be
      # what requirements-production.txt resolves to (and the in-image test
      # tooling lock must agree with it). Each lock is re-resolved onto a
      # copy of itself, so uv keeps the committed pins and this fails only
      # when an input change actually requires a different lock -- not
      # whenever some transitive package publishes a new release.
      - name: Lock files are up to date
        run: |
          set -euo pipefail
          cp requirements-production.lock /tmp/production.lock
          uv pip compile requirements-production.txt --python-version 3.12 \
            --python-platform x86_64-unknown-linux-gnu --generate-hashes --no-header --quiet -o /tmp/production.lock
          diff -u <(grep -v '^#' requirements-production.lock) <(grep -v '^#' /tmp/production.lock)
          cp requirements-image-test.lock /tmp/image-test.lock
          uv pip compile requirements-image-test.txt --constraint requirements-production.lock --python-version 3.12 \
            --python-platform x86_64-unknown-linux-gnu --generate-hashes --no-header --quiet -o /tmp/image-test.lock
          diff -u <(grep -v '^#' requirements-image-test.lock) <(grep -v '^#' /tmp/image-test.lock)

      - name: Known-vulnerability audit of the production lock (pip-audit)
        run: uvx pip-audit@2.9.0 -r requirements-production.lock --require-hashes --disable-pip --progress-spinner off

      - name: Build production image
        run: docker build -f docker/Dockerfile.production -t "$IMAGE" .

      - name: Installed packages match the lock exactly
        run: docker run --rm "$IMAGE" python scripts/check_image_dependencies.py requirements-production.lock

      - name: Image runs as a non-root user
        run: test "$(docker run --rm "$IMAGE" id -u)" != "0"

      # The repository's test suite, run by the image's own interpreter and
      # site-packages. Test tooling goes into a separate --target directory
      # (hash-locked, versions constrained to the production lock), so the
      # image's installed packages are untouched. test_retriever.py needs
      # the RAG stack, which this image deliberately does not contain.
      - name: Test suite inside the production image
        run: |
          docker run --rm \
            -e APP_ENV=dev -e PERSISTENCE_MODE=dev -e AUTH_MODE=dev \
            -e PYTHONDONTWRITEBYTECODE=1 -e HOME=/tmp \
            -v "$PWD/tests:/app/tests:ro" \
            -v "$PWD/requirements-image-test.lock:/tmp/requirements-image-test.lock:ro" \
            "$IMAGE" sh -c '
              pip install --quiet --no-cache-dir --no-deps --require-hashes \
                --target /tmp/testdeps -r /tmp/requirements-image-test.lock &&
              PYTHONPATH=/tmp/testdeps:/app python -m pytest tests -p no:cacheprovider -q \
                --ignore=tests/test_retriever.py'

      - name: Database migrations apply from inside the image
        run: docker run --rm --network host -e PERSISTENCE_MODE=production -e DATABASE_URL "$IMAGE" python -m alembic upgrade head

      # Real entrypoint, APP_ENV=production, real RS256/JWKS validation,
      # PostgreSQL readiness and audit persistence, clean SIGTERM shutdown.
      - name: Production smoke test
        run: docker run --rm --network host -e PERSISTENCE_MODE=production -e DATABASE_URL "$IMAGE" python scripts/production_image_smoke.py

      - name: Refuses to start with missing or forbidden production configuration
        run: bash scripts/ci_image_failsafe.sh "$IMAGE"
