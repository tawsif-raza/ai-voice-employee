name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install CPU-only torch
        run: pip install torch --index-url https://download.pytorch.org/whl/cpu

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      # Quality gates run fastest-and-most-mechanical first, so a
      # formatting slip fails in seconds rather than after the full
      # (slower) test suite has already run. See
      # PHASE_14_1_WORKFLOW_HARDENING_REPORT.md for what each gate
      # enforces vs. treats as pre-existing, documented technical debt.
      - name: Check formatting (ruff format)
        run: python -m ruff format --check src/ tests/ scripts/ notebooks/

      - name: Lint (ruff check)
        run: python -m ruff check src/ tests/ scripts/ notebooks/

      - name: Type-check (mypy)
        run: python -m mypy src/

      - name: Run test suite
        env:
          PERSISTENCE_MODE: dev
          AUTH_MODE: dev
        run: python -m pytest tests/ -v
