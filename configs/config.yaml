# Centralized pipeline configuration.
#
# This file is the single source of truth for model / training / LoRA /
# data / export parameters. src/training/config.py reads it at import time
# and falls back to hardcoded defaults if a key (or the file) is missing,
# so scripts keep working even when run outside a checkout that has this
# file (e.g. a stripped-down container image).
#
# NOTE on numbers: keep floats like learning rates in plain decimal form
# (0.0002, not 2e-4) — PyYAML's default float resolver does not reliably
# treat bare scientific notation as a float.

model:
  model_name: Qwen/Qwen2.5-0.5B-Instruct
  load_in_4bit: true
  bnb_4bit_compute_dtype: bfloat16
  bnb_4bit_quant_type: nf4
  bnb_4bit_use_double_quant: true
  # Must match data.max_length below.
  max_seq_length: 512

lora:
  r: 16
  lora_alpha: 32
  lora_dropout: 0.05
  target_modules:
    - q_proj
    - k_proj
    - v_proj
    - o_proj
    - gate_proj
    - up_proj
    - down_proj
  bias: none
  task_type: CAUSAL_LM

training:
  output_dir: models/qwen-voice-assistant
  num_train_epochs: 3
  per_device_train_batch_size: 2
  gradient_accumulation_steps: 4
  learning_rate: 0.0002
  lr_scheduler_type: cosine
  warmup_steps: 10
  logging_steps: 10
  save_steps: 50
  max_grad_norm: 0.3
  bf16: true
  fp16: false
  packing: true
  seed: 42
  # -1 disables the cap and trains the full num_train_epochs.
  # Overridden by --max_steps on the CLI for smoke tests / dry runs.
  max_steps: -1
  assistant_only_loss: true

data:
  train_data_path: data/processed/train_final.json
  model_name: Qwen/Qwen2.5-0.5B-Instruct
  max_length: 512

# Phase 6 (evaluation harness) has not been built yet in this repo — these
# are the parameters it's expected to read once src/eval/evaluate.py exists.
evaluation:
  results_path: outputs/eval_results.json
  in_domain_cases: 10
  handoff_cases: 5
  out_of_domain_cases: 5

# RAG retrieval (src/rag/). Read by src/inference/predict.py at
# VoiceAssistantInference construction time. knowledge_dir/index_dir are
# relative to repo root (same convention as data.train_data_path above) —
# leave unset to use src/rag's own absolute defaults.
rag:
  enabled: true
  knowledge_dir: data/knowledge
  index_dir: outputs/rag_index
  embedding_model: sentence-transformers/all-MiniLM-L6-v2
  top_k: 3
  score_threshold: 0.35
  clinical_triggers_path: configs/clinical_triggers.yaml

export:
  base_model_name: Qwen/Qwen2.5-0.5B-Instruct
  output_dir: outputs/merged_model
  # bf16 or fp16
  dtype: bf16
  gguf_output_dir: outputs/gguf
  quant_types:
    - Q4_K_M
    - Q8_0

# LLM Provider Configuration (src/inference/llm_provider.py).
# Decoupled provider hierarchy. Overridden by environment variables
# (LLM_PROVIDER, ANTHROPIC_MODEL, GEMINI_MODEL, GROQ_MODEL).
#
# `provider` is deliberately left unset here (not hardcoded to "fallback")
# so that, absent an explicit LLM_PROVIDER env var, the provider is
# auto-selected from whichever credentials are actually present --
# see llm_provider._default_provider_mode(): "fallback" (paid, Claude
# primary -> Gemini fallback) only when ANTHROPIC_API_KEY is genuinely
# configured; "free_fallback" (Gemini primary -> Groq fallback, both
# free-tier) when Gemini+Groq keys are present but no Claude key;
# "gemini"/"groq" solo; else "local" (fully offline, zero cost). A
# deployment that always wants one specific mode regardless of which
# keys happen to be set should uncomment `provider:` below.
llm:
  # provider: fallback
  claude:
    # Primary model when LLM_PROVIDER=fallback (paid). Claude 3.5 Haiku is
    # optimized for sub-300ms voice TTFT and strict phone-cadence
    # instruction following.
    model: claude-3-5-haiku-latest
    timeout_seconds: 30
    max_tokens: 350
    temperature: 0.7
  gemini:
    # Free-tier eligible. Primary in "free_fallback" / "gemini" modes,
    # automatic fallback in "fallback" mode. High concurrency, ultra-fast
    # generation, seamless rate-limit resilience.
    model: gemini-2.5-flash
    timeout_seconds: 30
    max_tokens: 350
    temperature: 0.7
  groq:
    # Free-tier. Fallback in "free_fallback" mode, or standalone in "groq"
    # mode. qwen/qwen3.8-27b avoids Groq's reasoning-model token-budget
    # trap (see GroqLLMProvider's docstring / docs/FREE_TIER_SETUP.md).
    model: qwen/qwen3.8-27b
    timeout_seconds: 30
    max_tokens: 350
    temperature: 0.7
  fallback:
    cooldown_seconds: 60
